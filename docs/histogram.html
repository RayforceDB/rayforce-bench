<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>RayforceDB H2O Benchmark</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>body{font-family:sans-serif;padding:20px}</style>
</head><body>
<h2>RayforceDB H2O Benchmark</h2>
<div id="chart"></div>
<script>
const benches = ["groupby_q1", "groupby_q2", "groupby_q3", "groupby_q4", "groupby_q5", "groupby_q6", "groupby_q7", "sort_multi", "sort_single"];
const adapters = ["chdb", "datafusion", "duckdb", "pandas", "polars", "questdb", "rayforce", "timescale"];
const values = {"chdb": [248.742107, 1114.845703, 1337.039477, 1613.499791, 1471.887709, 1388.228912, 10548.200612, 17194.608585, 5871.26891], "datafusion": [1289.799157, 1580.209613, 2032.751015, 2467.752037, 2309.564192, 1895.858289, 3720.370858, 11707.466858, 5900.605015], "duckdb": [491.370065, 714.238652, 1112.123651, 1639.541377, 1246.840872, 1140.525028, 10369.866511, 18921.784021, 7816.517867], "pandas": [221.279345, 996.162783, 778.725927, 1076.364718, 845.33898, 913.968407, 9423.97443, 9120.562378, 10114.031948], "polars": [167.591121, 861.713747, 1959.049606, 2082.787405, 2088.37807, 1978.401363, 8872.34577, 16676.555902, 3367.607709], "questdb": [14.63029, 53.595571, 352.321337, 688.954569, 484.229844, 230.535051, 13372.501177, 29643.92684, 25789.865179], "rayforce": [23.938039, 37.302665, 67.115023, 105.544002, 69.686024, 51.047866, 1747.055119, null, null], "timescale": [452.336438, 669.89379, 1922.866091, 2317.049058, 2036.347389, 1251.934613, 30030.15841, 27957.775958, 19195.810968]};
const colors = ["#e377c2", "#17becf", "#1f77b4", "#8c564b", "#2ca02c", "#9467bd", "#ff7f0e", "#d62728"];
const traces = adapters.map((a, i) => ({
  x: benches,
  y: values[a],
  name: a,
  type: 'bar',
  marker: { color: colors[i] },
  text: values[a].map(v => v == null ? '' :
        v >= 1000 ? (v/1000).toFixed(2)+'s' : v.toFixed(1)+'ms'),
  textposition: 'outside',
  textfont: { size: 9 },
}));
Plotly.newPlot('chart', traces, {
  barmode: 'group',
  height: 500,
  yaxis: { title: 'Time (ms)', type: 'log' },
  template: 'plotly_white',
  legend: { orientation: 'h', y: 1.1 },
});
</script></body></html>
