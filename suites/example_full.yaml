# Full Example Benchmark Suite
#
# Tests all group-by queries on the small example dataset

name: example_full
description: Full group-by benchmark on example data (1000 rows)
version: "1.0.0"

dataset: example_groupby

warmup: 2
iterations: 5
cache_mode: warm

tasks:
  - id: groupby_q1
    description: "Q1: sum(v1) by id1"

  - id: groupby_q2
    description: "Q2: sum(v1) by id1, id2"

  - id: groupby_q3
    description: "Q3: sum(v1), avg(v3) by id3"

  - id: groupby_q4
    description: "Q4: avg(v1), avg(v2), avg(v3) by id4"

  - id: groupby_q5
    description: "Q5: sum(v1), sum(v2), sum(v3) by id6"

  - id: groupby_q6
    description: "Q6: max(v1) - min(v2) by id3"

  - id: groupby_q7
    description: "Q7: sum(v3), count by id1-id6 (wide group by)"
